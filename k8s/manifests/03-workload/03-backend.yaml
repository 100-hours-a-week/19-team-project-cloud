apiVersion: apps/v1
kind: Deployment
metadata:
  name: refit-backend
  namespace: refit-app
spec:
  replicas: 1 # 단일 워커 검증 단계 (정상 확인 후 2로 복원)
  selector:
    matchLabels:
      app: refit-backend
  template:
    metadata:
      labels:
        app: refit-backend
    spec:
      imagePullSecrets:
      - name: ecr-secret
      containers:
      - name: backend
        image: 807210685804.dkr.ecr.ap-northeast-2.amazonaws.com/refit-backend:develop-latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "250m"
            memory: "300Mi"
          limits:
            cpu: "500m"
            memory: "768Mi" # 512Mi에서 OOMKilled 발생하여 상향 (non-heap 메모리 고려)
        env:
        - name: JAVA_TOOL_OPTIONS
          value: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=50.0"
        - name: SPRING_CONFIG_IMPORT
          value: "optional:file:/config/secret/application-secret.yml"
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: "refit-kafka-svc.refit-app.svc.cluster.local:9092"
        volumeMounts:
        - name: secret-config
          mountPath: /config/secret
          readOnly: true
      volumes:
      - name: secret-config
        secret:
          secretName: refit-backend-secret
---
apiVersion: v1
kind: Service
metadata:
  name: refit-backend-svc
  namespace: refit-app
spec:
  selector:
    app: refit-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080
---
# 외부(대문)에서 이 백엔드로 들어올 수 있게 길을 터주는 표지판
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: refit-app
spec:
  parentRefs:
  - name: refit-gateway # 2단계에서 만든 Gateway(대문) 지정
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api # /api 어쩌구 로 시작하는 모든 요청은
    backendRefs:
    - name: refit-backend-svc # 위에서 만든 Spring Boot Service(내선번호)로 토스해라!
      port: 8080
