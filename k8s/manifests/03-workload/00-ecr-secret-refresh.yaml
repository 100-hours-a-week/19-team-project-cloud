apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-secret-refresher
  namespace: refit-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ecr-secret-refresher
  namespace: refit-app
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ecr-secret-refresher
  namespace: refit-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ecr-secret-refresher
subjects:
  - kind: ServiceAccount
    name: ecr-secret-refresher
    namespace: refit-app
---
# ECR 토큰은 12시간마다 만료 → 6시간마다 자동 갱신
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-secret-refresh
  namespace: refit-app
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-secret-refresher
          restartPolicy: OnFailure
          volumes:
            - name: shared
              emptyDir: {}
          initContainers:
            # ECR 토큰을 발급받아 공유 볼륨에 기록
            - name: get-ecr-token
              image: amazon/aws-cli:latest
              command:
                - /bin/sh
                - -c
                - aws ecr get-login-password --region ap-northeast-2 > /shared/ecr-pass
              envFrom:
                - secretRef:
                    name: aws-ecr-credentials
              volumeMounts:
                - name: shared
                  mountPath: /shared
          containers:
            # 공유 볼륨의 토큰으로 K8s Secret 갱신
            - name: update-secret
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  ECR_PASS=$(cat /shared/ecr-pass)
                  kubectl create secret docker-registry ecr-secret \
                    --docker-server=807210685804.dkr.ecr.ap-northeast-2.amazonaws.com \
                    --docker-username=AWS \
                    --docker-password="${ECR_PASS}" \
                    -n refit-app \
                    --dry-run=client -o yaml | kubectl apply -f -
              volumeMounts:
                - name: shared
                  mountPath: /shared
