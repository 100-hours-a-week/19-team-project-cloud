---
# refit-app 네임스페이스 기본 ingress 차단
# - 다른 네임스페이스(monitoring, argocd 등) Pod의 직접 접근 차단
# - Cilium Gateway 트래픽은 호스트 네트워크 레벨에서 처리되므로 영향 없음
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: refit-app
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
# Grafana Alloy(monitoring ns)의 메트릭 수집 허용
# - refit-backend: /actuator/prometheus (8080)
# - refit-ai: /metrics (8000)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-scrape
  namespace: refit-app
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8000
