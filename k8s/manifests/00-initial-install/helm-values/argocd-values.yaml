# ArgoCD v3.3.3 (chart: argo-cd-9.4.10)
# helm repo add argo https://argoproj.github.io/argo-helm
# helm install argocd argo/argo-cd --version 9.4.10 -n argocd --create-namespace -f argocd-values.yaml

applicationSet:
  enabled: false

dex:
  enabled: false

notifications:
  enabled: false

configs:
  params:
    server.insecure: true

server:
  service:
    type: ClusterIP

controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
