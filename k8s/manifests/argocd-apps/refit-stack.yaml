apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-foundation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/manifests/01-foundation
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
