apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-foundation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/manifests/01-foundation
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-networking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/manifests/02-networking
  destination:
    server: https://kubernetes.default.svc
    namespace: refit-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Redis, Kafka 등 인프라성 워크로드 (raw manifests)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/manifests/03-workload
    directory:
      include: "{01-redis.yaml,02-kafka.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: refit-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Backend (Helm chart)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/helm/refit-backend
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: refit-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-ai
  namespace: argocd
  annotations:
    argocd-image-updater.argoproj.io/image-list: refit-ai=807210685804.dkr.ecr.ap-northeast-2.amazonaws.com/refit-ai
    argocd-image-updater.argoproj.io/refit-ai.update-strategy: latest
    argocd-image-updater.argoproj.io/refit-ai.tag.regexp: ^main-[0-9a-f]+$
    argocd-image-updater.argoproj.io/refit-ai.helm.image-name: image.repository
    argocd-image-updater.argoproj.io/refit-ai.helm.image-tag: image.tag
    argocd-image-updater.argoproj.io/write-back-method: git:secret:argocd/git-creds
    argocd-image-updater.argoproj.io/write-back-target: helmvalues:/k8s/helm/refit-ai/values.yaml
    argocd-image-updater.argoproj.io/git-branch: main
    notifications.argoproj.io/subscribe.on-sync-succeeded.discord-ai: ""
    notifications.argoproj.io/subscribe.on-sync-failed.discord-ai: ""
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/helm/refit-ai
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: refit-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
