# ---------------------------------------------------------------
# Monitoring Stack (ArgoCD 2.6+ multi-source)
# Helm repo chart + Git values 분리 방식
# ---------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-prometheus
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: "67.11.0"
      helm:
        valueFiles:
          - $values/k8s/helm/monitoring/kube-prometheus-stack/values.yaml
    - repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
