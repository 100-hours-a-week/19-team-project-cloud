apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-foundation
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/manifests/01-foundation
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-networking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/manifests/02-networking
  destination:
    server: https://kubernetes.default.svc
    namespace: refit-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Redis, Kafka 등 인프라성 워크로드 (raw manifests)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/manifests/03-workload
    directory:
      include: "{01-redis.yaml,02-kafka.yaml}"
  destination:
    server: https://kubernetes.default.svc
    namespace: refit-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
# Backend (Helm chart)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: refit-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/100-hours-a-week/19-team-project-cloud.git
    targetRevision: main
    path: k8s/helm/refit-backend
  destination:
    server: https://kubernetes.default.svc
    namespace: refit-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
