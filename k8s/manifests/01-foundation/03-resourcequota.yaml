apiVersion: v1
kind: ResourceQuota
metadata:
  name: refit-app-quota
  namespace: refit-app
spec:
  hard:
    requests.memory: "2.5Gi"
    limits.memory: "3.5Gi"
    pods: "15"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.memory: "1Gi"
    limits.memory: "2Gi"
    pods: "10"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: argocd-quota
  namespace: argocd
spec:
  hard:
    requests.memory: "512Mi"
    limits.memory: "1Gi"
    pods: "5"
