apiVersion: v1
kind: ResourceQuota
metadata:
  name: refit-app-quota
  namespace: refit-app
spec:
  hard:
    requests.memory: "8Gi"
    limits.memory: "11Gi"
    pods: "15"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-quota
  namespace: monitoring
spec:
  hard:
    requests.memory: "5Gi"   # 실측 ~3Gi + 여유 2Gi
    limits.memory: "16Gi"    # Prometheus 4Gi + Tempo 3Gi + Loki 1Gi + Alloy×6 1.2Gi + 기타
    pods: "25"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: argocd-quota
  namespace: argocd
spec:
  hard:
    requests.memory: "3Gi"
    limits.memory: "6Gi"
    pods: "15"
