# refit-app: 앱 파드가 limits 미지정 시 default 자동 적용을 위해 LimitRange 유지
# monitoring/argocd: 모든 컴포넌트가 Helm values에서 직접 limits 정의하므로 LimitRange 불필요
#   → per-container max가 인프라 컴포넌트(Tempo, Loki 등)의 정상 기동을 차단하는 문제 방지
#   → namespace 총량은 ResourceQuota로 제한
apiVersion: v1
kind: LimitRange
metadata:
  name: refit-app-limits
  namespace: refit-app
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "2"
      memory: 4Gi
