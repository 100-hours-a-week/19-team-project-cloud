# refit-app: 앱 파드 limits 미지정 시 default 자동 적용
# monitoring: limits 미지정 sidecar(config-reloader 등)에 default 자동 적용
#   max 미설정 — Prometheus/Tempo/Loki 등 대용량 컴포넌트 차단 방지
#   총량은 ResourceQuota(requests.memory + pods)로 제한
apiVersion: v1
kind: LimitRange
metadata:
  name: refit-app-limits
  namespace: refit-app
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: "2"
      memory: 4Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-limits
  namespace: monitoring
spec:
  limits:
  - type: Container
    default:
      cpu: 200m
      memory: 256Mi
    defaultRequest:
      cpu: 50m
      memory: 64Mi
