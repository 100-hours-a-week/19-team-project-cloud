image:
  repository: 807210685804.dkr.ecr.ap-northeast-2.amazonaws.com/refit-backend
  tag: "production-04750c5"
  pullPolicy: IfNotPresent

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

vpa:
  enabled: true
  updateMode: "Off"   # Off: 추천값만 수집, Auto로 변경하면 자동 적용
  minAllowed:
    memory: "256Mi"
  maxAllowed:
    memory: "1Gi"

deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

minReadySeconds: 30
terminationGracePeriodSeconds: 60

resources:
  requests:
    cpu: "250m"
    memory: "300Mi"
  limits:
    cpu: "500m"
    memory: "768Mi"

env:
  javaToolOptions: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=50.0"

# Secret 이름 (External Secrets로 별도 관리)
secretName: refit-backend-secret

service:
  port: 8080

gateway:
  name: refit-gateway
  routes:
    - paths:
        - /api/ws
      timeouts:
        request: "3600s"
        backendRequest: "3600s"
    - paths:
        - /api
        - /actuator
      timeouts:
        request: "60s"
        backendRequest: "60s"

startupProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 20
  periodSeconds: 10
  failureThreshold: 18
  timeoutSeconds: 5

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  periodSeconds: 10
  failureThreshold: 3

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  periodSeconds: 20
  failureThreshold: 3

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchLabels:
            app: refit-backend
        topologyKey: kubernetes.io/hostname
