apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: refit-backend-external-secret
  namespace: refit-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: application-secret.yml
    remoteRef:
      key: refit/backend
      conversionStrategy: Default
      decodingStrategy: None
      metadataPolicy: None
  # AWS SDK v2 자격증명 체인이 환경변수에서 인식할 수 있도록 별도 키로 추가
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: refit/backend
      property: spring.cloud.aws.credentials.access-key
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: refit/backend
      property: spring.cloud.aws.credentials.secret-key
      decodingStrategy: None
      metadataPolicy: None
  - secretKey: AWS_REGION
    remoteRef:
      key: refit/backend
      property: spring.cloud.aws.region.static
      decodingStrategy: None
      metadataPolicy: None
