{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: refit-backend
  namespace: refit-app
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: refit-backend
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
    - containerName: refit-backend
      controlledResources:
      - memory
      minAllowed:
        memory: {{ .Values.vpa.minAllowed.memory }}
      maxAllowed:
        memory: {{ .Values.vpa.maxAllowed.memory }}
{{- end }}
