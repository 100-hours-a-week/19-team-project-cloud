apiVersion: apps/v1
kind: Deployment
metadata:
  name: refit-backend
  namespace: refit-app
spec:
  revisionHistoryLimit: 3
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  minReadySeconds: {{ .Values.minReadySeconds }}
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  selector:
    matchLabels:
      app: refit-backend
  template:
    metadata:
      labels:
        app: refit-backend
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      imagePullSecrets:
      - name: ecr-secret
      initContainers:
      - name: otel-javaagent
        image: curlimages/curl:8.12.1
        imagePullPolicy: IfNotPresent
        command:
        - /bin/sh
        - -c
        - >
          curl -fsSL
          -o /otel/opentelemetry-javaagent.jar
          https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar
        volumeMounts:
        - name: otel-javaagent
          mountPath: /otel
      containers:
      - name: backend
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.service.port }}
        lifecycle:
          preStop:
            exec:
              # readiness 실패 전파 + 기존 WebSocket 연결 드레이닝 대기
              command: ["/bin/sh", "-c", "sleep 15"]
        {{- with .Values.startupProbe }}
        startupProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.readinessProbe }}
        readinessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with .Values.livenessProbe }}
        livenessProbe:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        resources:
          requests:
            cpu: {{ .Values.resources.requests.cpu }}
            memory: {{ .Values.resources.requests.memory }}
          limits:
            cpu: {{ .Values.resources.limits.cpu }}
            memory: {{ .Values.resources.limits.memory }}
        env:
        - name: JAVA_TOOL_OPTIONS
          value: {{ printf "%s -javaagent:/otel/opentelemetry-javaagent.jar" .Values.env.javaToolOptions | quote }}
        - name: SPRING_CONFIG_IMPORT
          value: "optional:file:/config/secret/application-secret.yml"
        # OTel — 같은 노드의 DaemonSet Collector로 전송
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: "http://$(NODE_IP):4318"
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_SERVICE_NAME
          value: "refit-backend"
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: "deployment.environment=prod,k8s.namespace.name=refit-app"
        - name: OTEL_TRACES_EXPORTER
          value: "otlp"
        - name: OTEL_METRICS_EXPORTER
          value: "otlp"
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        # AWS SDK v2 자격증명 주입 (EnvironmentVariableCredentialsProvider 체인 지원)
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_SECRET_ACCESS_KEY
        - name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: aws-credentials
              key: AWS_REGION
        volumeMounts:
        - name: secret-config
          mountPath: /config/secret
          readOnly: true
        - name: otel-javaagent
          mountPath: /otel
          readOnly: true
      volumes:
      - name: secret-config
        secret:
          secretName: {{ .Values.secretName }}
      - name: otel-javaagent
        emptyDir: {}
