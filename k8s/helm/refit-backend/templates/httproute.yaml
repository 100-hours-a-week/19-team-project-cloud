apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: refit-app
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
  rules:
  - matches:
    {{- range .Values.gateway.pathPrefixes }}
    - path:
        type: PathPrefix
        value: {{ . }}
    {{- end }}
    backendRefs:
    - name: refit-backend-svc
      port: {{ .Values.service.port }}
