# kube-prometheus-stack
# - node-exporter 미사용: Alloy kubelet scrape로 대체
# - admissionWebhooks 비활성화: kubeadm 소규모 클러스터
# - 모든 컴포넌트: worker 노드 전용
# - crds.enabled: false — CRD 스펙이 256KB를 초과해 ArgoCD SSA 패치 불가
#   CRD는 최초 1회 수동 설치 후 ArgoCD 관리 대상에서 제외

crds:
  enabled: false

# ---------------------------------------------------------------
# Kafka (MSK) 알람 규칙
# KMinion ServiceMonitor가 수집한 메트릭 기반
# ---------------------------------------------------------------
additionalPrometheusRulesMap:
  kafka-rules:
    groups:
      - name: kafka.storage
        rules:
          - alert: KafkaBrokerDiskHigh
            expr: |
              kminion_kafka_broker_log_dir_size_total_bytes
                / (20 * 1024 * 1024 * 1024)
                * 100 > 75
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "MSK 브로커 디스크 사용량 75% 초과"
              description: "브로커 {{ $labels.broker_id }} 디스크 사용량이 {{ $value | printf \"%.1f\" }}% 입니다 (EBS 20GB 기준). 파티션 정리 또는 용량 증설 필요."
          - alert: KafkaBrokerDiskCritical
            expr: |
              kminion_kafka_broker_log_dir_size_total_bytes
                / (20 * 1024 * 1024 * 1024)
                * 100 > 90
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "MSK 브로커 디스크 사용량 90% 초과 — 즉시 조치 필요"
              description: "브로커 {{ $labels.broker_id }} 디스크 사용량이 {{ $value | printf \"%.1f\" }}% 입니다."

      - name: kafka.consumer
        rules:
          - alert: KafkaConsumerLagHigh
            expr: |
              sum by (group, topic) (
                kminion_kafka_consumer_group_topic_partition_lag
              ) > 1000
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kafka Consumer Lag 급증"
              description: "Consumer group '{{ $labels.group }}', topic '{{ $labels.topic }}' lag이 {{ $value }} 입니다."
          - alert: KafkaConsumerGroupDead
            expr: |
              kminion_kafka_consumer_group_empty_partitions_total > 0
                unless kminion_kafka_consumer_group_members_count > 0
            for: 3m
            labels:
              severity: warning
            annotations:
              summary: "Kafka Consumer Group 멤버 없음"
              description: "Consumer group '{{ $labels.group }}' 에 활성 멤버가 없습니다."

      - name: kafka.e2e
        rules:
          - alert: KafkaE2ELatencyHigh
            expr: |
              histogram_quantile(0.99,
                rate(kminion_end_to_end_produce_latency_seconds_bucket[5m])
              ) > 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Kafka E2E produce 레이턴시 p99 > 1s"
              description: "KMinion E2E 테스트 produce p99 레이턴시가 {{ $value | printf \"%.2f\" }}s 입니다."

# ---------------------------------------------------------------
# kubeadm HA control plane은 별도 Service/ServiceMonitor 매니페스트로 관리
# (Cilium이 kube-proxy 대체이므로 kube-proxy는 제외)
# ---------------------------------------------------------------
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# ---------------------------------------------------------------
# node-exporter DaemonSet은 띄우지 않고, Alloy의 unix exporter 라벨을
# kube-prometheus 표준(job="node-exporter")에 맞춰 호환시킴
# ---------------------------------------------------------------
nodeExporter:
  enabled: false
prometheus-node-exporter:
  enabled: false

# ---------------------------------------------------------------
# PrometheusOperator
# ---------------------------------------------------------------
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false      # cert-patch Job 비활성화 → kube-prometheus-stack-admission secret 미생성
  tls:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: "8GB"
    enableRemoteWriteReceiver: true        # Alloy remote_write 수신
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 1Gi
    nodeSelector:
      node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# Grafana
# ---------------------------------------------------------------
grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  # existingSecret 사용 시 기본값이 valueFrom과 충돌하는 것을 방지
  adminUser: ""
  adminPassword: ""
  image:
    tag: 11.6.0
  plugins:
    - https://storage.googleapis.com/integration-artifacts/grafana-lokiexplore-app/release/main/any/grafana-lokiexplore-app-main.zip;grafana-lokiexplore-app
    - https://storage.googleapis.com/integration-artifacts/grafana-exploretraces-app/grafana-exploretraces-app-latest.zip;grafana-traces-app

  # ---------------------------------------------------------------
  # kubernetes-mixin 기본 대시보드 비활성화
  # 필요한 것만 dashboardProviders + dashboards 로 명시적 관리
  # ---------------------------------------------------------------
  defaultDashboardsEnabled: false

  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: kubernetes
          orgId: 1
          folder: Kubernetes
          type: file
          disableDeletion: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes

  # grafana.com gnetId 방식으로 필요한 대시보드만 로드
  dashboards:
    kubernetes:
      # Kubernetes / API server (kube-prometheus-stack 호환)
      k8s-system-apiserver:
        gnetId: 15761
        revision: 20
        datasource: Prometheus
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 512Mi
  sidecar:
    dashboards:
      folder: /var/lib/grafana/dashboards
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
  persistence:
    enabled: false
  service:
    type: ClusterIP
  additionalDataSources:
    # ---------------------------------------------------------------
    # AWS CloudWatch — CloudFront + Lambda 프론트엔드 모니터링
    # 노드 IAM Role(RefitEC2SSMRole)에 CloudWatchReadOnlyAccess 이미 부여됨
    # ---------------------------------------------------------------
    - name: CloudWatch
      type: cloudwatch
      uid: cloudwatch
      access: proxy
      jsonData:
        defaultRegion: ap-northeast-2
        authType: default   # EC2 인스턴스 IAM Role 자동 사용

    - name: Loki
      type: loki
      uid: loki
      url: http://monitoring-loki.monitoring.svc.cluster.local:3100
      access: proxy
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '"traceId":"(\w+)"'
            url: "${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://monitoring-tempo.monitoring.svc.cluster.local:3200
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# AlertManager
# ---------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
    nodeSelector:
      node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# kube-state-metrics
# ---------------------------------------------------------------
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# kubelet / cadvisor 계열 메트릭에 cluster 라벨 추가
# 기본 Kubernetes mixin 대시보드 호환용
# ---------------------------------------------------------------
kubelet:
  serviceMonitor:
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: cluster
        replacement: refit-k8s
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: cluster
        replacement: refit-k8s
    probesRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: cluster
        replacement: refit-k8s
    resourceRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: cluster
        replacement: refit-k8s
