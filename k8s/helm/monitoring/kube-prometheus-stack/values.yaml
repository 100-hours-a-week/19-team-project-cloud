# kube-prometheus-stack
# - node-exporter 미사용: Alloy kubelet scrape로 대체
# - admissionWebhooks 비활성화: kubeadm 소규모 클러스터
# - 모든 컴포넌트: worker 노드 전용

# ---------------------------------------------------------------
# 불필요한 내부 컴포넌트 대시보드/스크레이프 비활성화
# (Cilium이 kube-proxy 대체, etcd/scheduler/controller-manager 모니터링 불필요)
# ---------------------------------------------------------------
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# ---------------------------------------------------------------
# node-exporter 비활성화
# ---------------------------------------------------------------
nodeExporter:
  enabled: false
prometheus-node-exporter:
  enabled: false

# ---------------------------------------------------------------
# PrometheusOperator
# ---------------------------------------------------------------
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false      # cert-patch Job 비활성화 → kube-prometheus-stack-admission secret 미생성
  tls:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: "8GB"
    enableRemoteWriteReceiver: true        # Alloy remote_write 수신
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 1Gi
    nodeSelector:
      node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# Grafana
# ---------------------------------------------------------------
grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 50m
      memory: 150Mi
    limits:
      cpu: 200m
      memory: 300Mi
  sidecar:
    dashboards:
      folder: /var/lib/grafana/dashboards
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
  persistence:
    enabled: false
  service:
    type: NodePort
    nodePort: 32000
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://loki-gateway.monitoring.svc.cluster.local
      access: proxy
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '"traceId":"(\w+)"'
            url: "${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo.monitoring.svc.cluster.local:3100
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: kubernetes
          orgId: 1
          folder: Kubernetes
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/kubernetes
        - name: loki
          orgId: 1
          folder: Loki
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/loki
        - name: cilium
          orgId: 1
          folder: Cilium / Hubble
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/cilium
  dashboards:
    kubernetes:
      kubernetes-all-in-one-kr:
        gnetId: 23000
        revision: 1
        datasource:
          - name: DS_PROMETHEUS
            value: Prometheus
    loki:
      loki-logs:
        gnetId: 13639
        revision: 2
        datasource:
          - name: DS_LOKI
            value: Loki
      loki-kubernetes-events:
        gnetId: 15141
        revision: 1
        datasource:
          - name: DS_LOKI
            value: Loki
    cilium:
      cilium-agent:
        gnetId: 16611
        revision: 2
        datasource: Prometheus
      cilium-operator:
        gnetId: 16612
        revision: 2
        datasource: Prometheus
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# AlertManager
# ---------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
    nodeSelector:
      node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# kube-state-metrics
# ---------------------------------------------------------------
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    node-role.kubernetes.io/worker: ""
