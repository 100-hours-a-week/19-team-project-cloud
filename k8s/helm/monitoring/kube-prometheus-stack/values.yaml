# kube-prometheus-stack
# - node-exporter 미사용: Alloy kubelet scrape로 대체
# - admissionWebhooks 비활성화: kubeadm 소규모 클러스터
# - 모든 컴포넌트: worker 노드 전용

# ---------------------------------------------------------------
# kubeadm HA control plane은 별도 Service/ServiceMonitor 매니페스트로 관리
# (Cilium이 kube-proxy 대체이므로 kube-proxy는 제외)
# ---------------------------------------------------------------
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

# ---------------------------------------------------------------
# node-exporter DaemonSet은 띄우지 않고, Alloy의 unix exporter 라벨을
# kube-prometheus 표준(job="node-exporter")에 맞춰 호환시킴
# ---------------------------------------------------------------
nodeExporter:
  enabled: false
prometheus-node-exporter:
  enabled: false

# ---------------------------------------------------------------
# PrometheusOperator
# ---------------------------------------------------------------
prometheusOperator:
  admissionWebhooks:
    enabled: false
    patch:
      enabled: false      # cert-patch Job 비활성화 → kube-prometheus-stack-admission secret 미생성
  tls:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: 200m
      memory: 200Mi
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# Prometheus
# ---------------------------------------------------------------
prometheus:
  prometheusSpec:
    retention: 3d
    retentionSize: "8GB"
    enableRemoteWriteReceiver: true        # Alloy remote_write 수신
    ruleSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        cpu: 500m
        memory: 1Gi
    nodeSelector:
      node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# Grafana
# ---------------------------------------------------------------
grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password
  # existingSecret 사용 시 기본값이 valueFrom과 충돌하는 것을 방지
  adminUser: ""
  adminPassword: ""
  image:
    tag: 11.6.0
  plugins:
    - https://storage.googleapis.com/integration-artifacts/grafana-lokiexplore-app/release/main/any/grafana-lokiexplore-app-main.zip;grafana-lokiexplore-app
    - https://storage.googleapis.com/integration-artifacts/grafana-exploretraces-app/grafana-exploretraces-app-latest.zip;grafana-traces-app
  resources:
    requests:
      cpu: 50m
      memory: 200Mi
    limits:
      cpu: 200m
      memory: 512Mi
  sidecar:
    dashboards:
      folder: /var/lib/grafana/dashboards
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    resources:
      requests:
        cpu: 10m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
  persistence:
    enabled: false
  service:
    type: ClusterIP
  additionalDataSources:
    - name: Loki
      type: loki
      uid: loki
      url: http://monitoring-loki-gateway.monitoring.svc.cluster.local
      access: proxy
      jsonData:
        derivedFields:
          - name: TraceID
            matcherRegex: '"traceId":"(\w+)"'
            url: "${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://monitoring-tempo.monitoring.svc.cluster.local:3200
      access: proxy
      jsonData:
        tracesToLogsV2:
          datasourceUid: loki
          filterByTraceID: true
        tracesToMetrics:
          datasourceUid: prometheus
        serviceMap:
          datasourceUid: prometheus
        nodeGraph:
          enabled: true
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# AlertManager
# ---------------------------------------------------------------
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
    nodeSelector:
      node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# kube-state-metrics
# ---------------------------------------------------------------
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# ---------------------------------------------------------------
# kubelet / cadvisor 계열 메트릭에 cluster 라벨 추가
# 기본 Kubernetes mixin 대시보드 호환용
# ---------------------------------------------------------------
kubelet:
  serviceMonitor:
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: cluster
        replacement: refit-k8s
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: cluster
        replacement: refit-k8s
    probesRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: cluster
        replacement: refit-k8s
    resourceRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
      - action: replace
        targetLabel: cluster
        replacement: refit-k8s
