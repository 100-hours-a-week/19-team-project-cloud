# Loki
# 수신: Grafana Alloy → OTLP HTTP
# 모드: SingleBinary (소규모 클러스터)

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  server:
    http_listen_port: 3100
  limits_config:
    allow_structured_metadata: true   # OTel 로그 메타데이터 허용
    volume_enabled: true
    retention_period: 168h            # 7일
  pattern_ingester:
    enabled: true

singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 512Mi
  nodeSelector:
    node-role.kubernetes.io/worker: ""

# Promtail 비활성화 — Alloy로 대체
# SimpleScalable 컴포넌트 비활성화 (SingleBinary와 충돌 방지)
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

test:
  enabled: false
lokiCanary:
  enabled: false

# SingleBinary + filesystem 모드에서 memcached 캐시 불필요
# 기본값 enabled=true이면 9Gi+ 메모리 낭비
chunksCache:
  enabled: false
resultsCache:
  enabled: false
