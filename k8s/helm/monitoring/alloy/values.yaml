# Grafana Alloy
# OTel Collector 대체 — DaemonSet (CP + Worker 전체 노드)
# 파이프라인:
#   Apps OTLP → memory_limiter → k8sattributes → resource → batch
#     metrics → Prometheus remote_write
#     logs    → Loki OTLP HTTP
#     traces  → Tempo OTLP gRPC
#   kubelet / cadvisor scrape → Prometheus remote_write
#   hubble metrics (cilium:9965) → Prometheus remote_write
#   filelog + k8s_events → Loki write

alloy:
  stabilityLevel: experimental  # loki.source.kubernetes_events 사용

  configMap:
    content: |
      otelcol.receiver.otlp "default" {
        grpc { endpoint = "0.0.0.0:4317" }
        http { endpoint = "0.0.0.0:4318" }
        output {
          metrics = [otelcol.processor.k8sattributes.default.input]
          logs    = [otelcol.processor.k8sattributes.default.input]
          traces  = [otelcol.processor.k8sattributes.default.input]
        }
      }

      otelcol.processor.k8sattributes "default" {
        auth_type   = "serviceAccount"
        passthrough = false
        extract {
          metadata = [
            "k8s.pod.name",
            "k8s.pod.uid",
            "k8s.namespace.name",
            "k8s.deployment.name",
            "k8s.node.name",
          ]
        }
        pod_association {
          source {
            from = "resource_attribute"
            name = "k8s.pod.ip"
          }
        }
        pod_association {
          source { from = "connection" }
        }
        output {
          metrics = [otelcol.processor.transform.add_cluster.input]
          logs    = [otelcol.processor.transform.add_cluster.input]
          traces  = [otelcol.processor.transform.add_cluster.input]
        }
      }

      otelcol.processor.transform "add_cluster" {
        error_mode = "ignore"
        metric_statements {
          context    = "resource"
          statements = [
            `set(attributes["cluster.name"], "refit-k8s")`,
            `set(attributes["deployment.environment"], "prod") where attributes["deployment.environment"] == nil`,
          ]
        }
        log_statements {
          context    = "resource"
          statements = [
            `set(attributes["cluster.name"], "refit-k8s")`,
            `set(attributes["deployment.environment"], "prod") where attributes["deployment.environment"] == nil`,
          ]
        }
        trace_statements {
          context    = "resource"
          statements = [
            `set(attributes["cluster.name"], "refit-k8s")`,
            `set(attributes["deployment.environment"], "prod") where attributes["deployment.environment"] == nil`,
          ]
        }
        output {
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.batch.default.input]
          traces  = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        send_batch_size = 1000
        timeout         = "5s"
        output {
          metrics = [otelcol.exporter.prometheus.otel.input]
          logs    = [otelcol.exporter.otlphttp.loki.input]
          traces  = [otelcol.exporter.otlp.tempo.input]
        }
      }

      // OTel 메트릭 → Prometheus 포맷 변환 후 remote_write
      otelcol.exporter.prometheus "otel" {
        resource_to_telemetry_conversion = true
        forward_to = [prometheus.relabel.otel.receiver]
      }

      prometheus.relabel "otel" {
        rule {
          target_label = "cluster"
          replacement  = "refit-k8s"
        }
        rule {
          target_label = "environment"
          replacement  = "prod"
        }
        forward_to = [prometheus.remote_write.default.receiver]
      }

      otelcol.exporter.otlphttp "loki" {
        client {
          endpoint = "http://monitoring-loki-gateway.monitoring.svc.cluster.local/otlp"
          tls {
            insecure = true
          }
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "monitoring-tempo-0.monitoring-tempo-headless.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }

      prometheus.scrape "kubelet" {
        targets = [{
          __address__ = env("NODE_IP") + ":10250",
          job         = "kubelet",
          node        = env("NODE_NAME"),
          cluster     = "refit-k8s",
          environment = "prod",
        }]
        scheme            = "https"
        scrape_interval   = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config { insecure_skip_verify = true }
        forward_to = [prometheus.relabel.infra.receiver]
      }

      prometheus.scrape "cadvisor" {
        targets = [{
          __address__ = env("NODE_IP") + ":10250",
          job         = "cadvisor",
          node        = env("NODE_NAME"),
          cluster     = "refit-k8s",
          environment = "prod",
        }]
        metrics_path      = "/metrics/cadvisor"
        scheme            = "https"
        scrape_interval   = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config { insecure_skip_verify = true }
        forward_to = [prometheus.relabel.infra.receiver]
      }

      // node-exporter 대체 — node_* 메트릭 수집 (dashboard 23000 등에서 사용)
      prometheus.exporter.unix "node" {
        rootfs_path = "/host/root"
        procfs_path = "/host/proc"
        sysfs_path  = "/host/sys"
      }

      discovery.relabel "unix_node_compat" {
        targets = prometheus.exporter.unix.node.targets

        rule {
          target_label = "job"
          replacement  = "node-exporter"
        }

        rule {
          target_label = "cluster"
          replacement  = "refit-k8s"
        }

        rule {
          target_label = "environment"
          replacement  = "prod"
        }
      }

      prometheus.scrape "unix_node" {
        targets         = discovery.relabel.unix_node_compat.output
        scrape_interval = "30s"
        forward_to      = [prometheus.relabel.infra.receiver]
      }

      prometheus.scrape "hubble" {
        targets = [{
          __address__ = env("NODE_IP") + ":9965",
          job         = "hubble",
          node        = env("NODE_NAME"),
          cluster     = "refit-k8s",
          environment = "prod",
        }]
        scrape_interval = "30s"
        forward_to      = [prometheus.relabel.infra.receiver]
      }

      discovery.kubernetes "nodes" {
        role = "node"
      }

      discovery.relabel "self_control_plane" {
        targets = discovery.kubernetes.nodes.targets

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          regex         = env("NODE_NAME")
          action        = "keep"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_labelpresent_node_role_kubernetes_io_control_plane"]
          regex         = "true"
          action        = "keep"
        }
      }

      discovery.relabel "kube_scheduler_local" {
        targets = discovery.relabel.self_control_plane.output

        rule {
          target_label = "__address__"
          replacement  = "127.0.0.1:10259"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }

        rule {
          target_label = "job"
          replacement  = "kube-scheduler"
        }

        rule {
          target_label = "component"
          replacement  = "kube-scheduler"
        }

        rule {
          target_label = "cluster"
          replacement  = "refit-k8s"
        }

        rule {
          target_label = "environment"
          replacement  = "prod"
        }
      }

      prometheus.scrape "kube_scheduler_local" {
        targets           = discovery.relabel.kube_scheduler_local.output
        scheme            = "https"
        scrape_interval   = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config { insecure_skip_verify = true }
        forward_to = [prometheus.relabel.infra.receiver]
      }

      discovery.relabel "kube_controller_manager_local" {
        targets = discovery.relabel.self_control_plane.output

        rule {
          target_label = "__address__"
          replacement  = "127.0.0.1:10257"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }

        rule {
          target_label = "job"
          replacement  = "kube-controller-manager"
        }

        rule {
          target_label = "component"
          replacement  = "kube-controller-manager"
        }

        rule {
          target_label = "cluster"
          replacement  = "refit-k8s"
        }

        rule {
          target_label = "environment"
          replacement  = "prod"
        }
      }

      prometheus.scrape "kube_controller_manager_local" {
        targets           = discovery.relabel.kube_controller_manager_local.output
        scheme            = "https"
        scrape_interval   = "30s"
        bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"
        tls_config { insecure_skip_verify = true }
        forward_to = [prometheus.relabel.infra.receiver]
      }

      discovery.relabel "etcd_local" {
        targets = discovery.relabel.self_control_plane.output

        rule {
          target_label = "__address__"
          replacement  = "127.0.0.1:2381"
        }

        rule {
          source_labels = ["__meta_kubernetes_node_name"]
          target_label  = "node"
        }

        rule {
          target_label = "job"
          replacement  = "etcd"
        }

        rule {
          target_label = "component"
          replacement  = "etcd"
        }

        rule {
          target_label = "cluster"
          replacement  = "refit-k8s"
        }

        rule {
          target_label = "environment"
          replacement  = "prod"
        }
      }

      prometheus.scrape "etcd_local" {
        targets         = discovery.relabel.etcd_local.output
        scheme          = "http"
        scrape_interval = "30s"
        forward_to      = [prometheus.relabel.infra.receiver]
      }

      prometheus.relabel "infra" {
        rule {
          target_label = "cluster"
          replacement  = "refit-k8s"
        }
        rule {
          target_label = "environment"
          replacement  = "prod"
        }
        forward_to = [prometheus.remote_write.default.receiver]
      }

      prometheus.remote_write "default" {
        endpoint {
          url = "http://monitoring-prometheus-kube-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
        }
      }

      local.file_match "pods" {
        path_targets = [{"__path__" = "/var/log/pods/*/*/*.log"}]
        sync_period  = "10s"
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        stage.static_labels {
          values = {
            cluster     = "refit-k8s",
            environment = "prod",
          }
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.source.kubernetes_events "events" {
        namespaces = ["refit-app", "monitoring", "argocd", "kube-system"]
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://monitoring-loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
        }
      }

  extraEnv:
    - name: NODE_IP
      valueFrom:
        fieldRef:
          fieldPath: status.hostIP
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName

  extraPorts:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
    - name: otlp-http
      port: 4318
      targetPort: 4318
      protocol: TCP

  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 300m
      memory: 200Mi

controller:
  type: daemonset
  hostNetwork: true
  dnsPolicy: ClusterFirstWithHostNet
  tolerations:
    - effect: NoSchedule
      operator: Exists
    - effect: NoExecute
      operator: Exists
  extraVolumeMounts:
    - name: varlogpods
      mountPath: /var/log/pods
      readOnly: true
    - name: varlibdockercontainers
      mountPath: /var/lib/docker/containers
      readOnly: true
    - name: hostproc
      mountPath: /host/proc
      readOnly: true
    - name: hostsys
      mountPath: /host/sys
      readOnly: true
    - name: hostroot
      mountPath: /host/root
      readOnly: true
      mountPropagation: HostToContainer
  extraVolumes:
    - name: varlogpods
      hostPath:
        path: /var/log/pods
    - name: varlibdockercontainers
      hostPath:
        path: /var/lib/docker/containers
    - name: hostproc
      hostPath:
        path: /proc
    - name: hostsys
      hostPath:
        path: /sys
    - name: hostroot
      hostPath:
        path: /

rbac:
  create: true

serviceAccount:
  create: true

clusterRole:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "namespaces", "nodes", "events"]
      verbs: ["get", "list", "watch"]
    - apiGroups: ["apps"]
      resources: ["replicasets"]
      verbs: ["get", "list", "watch"]
