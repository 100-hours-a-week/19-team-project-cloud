{{- if .Values.vpa.enabled }}
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: refit-ai
  namespace: refit-app
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: refit-ai
  updatePolicy:
    updateMode: {{ .Values.vpa.updateMode | quote }}
  resourcePolicy:
    containerPolicies:
    - containerName: refit-ai
      controlledResources:
      - memory
      minAllowed:
        memory: {{ .Values.vpa.minAllowed.memory }}
      maxAllowed:
        memory: {{ .Values.vpa.maxAllowed.memory }}
{{- end }}
