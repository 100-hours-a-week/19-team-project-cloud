apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "refit-ai.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "refit-ai.labels" . | nindent 4 }}
spec:
  strategy:
    {{- toYaml .Values.deploymentStrategy | nindent 4 }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "refit-ai.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "refit-ai.selectorLabels" . | nindent 8 }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "refit-ai.fullname" . }}-secret
          lifecycle:
            preStop:
              exec:
                # 로드밸런서가 트래픽을 끊을 시간을 확보한 후 종료
                command: ["/bin/sh", "-c", "sleep 5"]
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: upload-volume
              mountPath: {{ .Values.uploadVolume.mountPath }}
      volumes:
        - name: upload-volume
          emptyDir: {}
